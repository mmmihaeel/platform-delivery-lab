apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app
  namespace: platform-delivery-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
        - name: node-app
          image: platform-delivery-lab/node-ts:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          env:
            - name: SERVICE_NAME
              value: node-runtime-api
            - name: SERVICE_RUNTIME
              value: nodejs20-typescript
            - name: SERVICE_VERSION
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: PLATFORM_VERSION
            - name: PORT
              value: "3007"
          ports:
            - containerPort: 3007
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
