server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Platform-Edge nginx always;

    location = /healthz {
        default_type application/json;
        return 200 '{"proxy":"nginx","status":"ok","routes":["/api/node","/api/go","/legacy","/diagnostics/apache-status"]}';
    }

    location = /diagnostics/routes {
        default_type application/json;
        return 200 '{"proxy":"nginx","routes":{"node":"/api/node","go":"/api/go","legacy":"/legacy","apacheStatus":"/diagnostics/apache-status"}}';
    }

    location /api/node/ {
        proxy_pass http://node-app:3007;
    }

    location /api/go/ {
        proxy_pass http://go-app:3008;
    }

    location /legacy/ {
        proxy_pass http://apache:80;
    }

    location /diagnostics/apache-status {
        proxy_pass http://apache:80/server-status;
    }
}
