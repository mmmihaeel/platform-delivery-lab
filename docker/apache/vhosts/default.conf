<VirtualHost *:80>
    ServerName localhost

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    Header always set X-Platform-Edge "apache"
    Alias /healthz "/usr/local/apache2/htdocs/healthz.json"
    Alias /routes "/usr/local/apache2/htdocs/routes.json"

    ProxyPass /php/ http://php-app:3010/
    ProxyPassReverse /php/ http://php-app:3010/

    ProxyPass /java/ http://java-app:3009/
    ProxyPassReverse /java/ http://java-app:3009/

    ProxyPass /legacy/php/ http://php-app:3010/
    ProxyPassReverse /legacy/php/ http://php-app:3010/

    ProxyPass /legacy/java/ http://java-app:3009/
    ProxyPassReverse /legacy/java/ http://java-app:3009/

    <Location /server-status>
        SetHandler server-status
        Require all granted
    </Location>

    <Location /healthz>
        Require all granted
    </Location>

    <Location /routes>
        Require all granted
    </Location>
</VirtualHost>
