services:
  node-app:
    image: platform-delivery-lab/node-ts:dev
    build:
      context: ./apps/node-ts
    environment:
      PLATFORM_ENV: ${PLATFORM_ENV:-local}
      SERVICE_NAME: node-runtime-api
      SERVICE_RUNTIME: nodejs20-typescript
      SERVICE_VERSION: ${PLATFORM_VERSION:-1.0.0}
      PORT: 3007
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3007/healthz | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "127.0.0.1:${NODE_PORT:-3007}:3007"
    restart: unless-stopped

  go-app:
    image: platform-delivery-lab/go:dev
    build:
      context: ./apps/go
    environment:
      PLATFORM_ENV: ${PLATFORM_ENV:-local}
      SERVICE_NAME: go-runtime-api
      SERVICE_RUNTIME: go
      SERVICE_VERSION: ${PLATFORM_VERSION:-1.0.0}
      PORT: 3008
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3008/healthz | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "127.0.0.1:${GO_PORT:-3008}:3008"
    restart: unless-stopped

  java-app:
    image: platform-delivery-lab/java:dev
    build:
      context: ./apps/java
    environment:
      PLATFORM_ENV: ${PLATFORM_ENV:-local}
      SERVICE_NAME: java-runtime-api
      SERVICE_RUNTIME: java11
      SERVICE_VERSION: ${PLATFORM_VERSION:-1.0.0}
      PORT: 3009
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3009/healthz | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:${JAVA_PORT:-3009}:3009"
    restart: unless-stopped

  php-app:
    image: platform-delivery-lab/php:dev
    build:
      context: ./apps/php
    environment:
      PLATFORM_ENV: ${PLATFORM_ENV:-local}
      SERVICE_NAME: php-runtime-api
      SERVICE_RUNTIME: php8.3
      SERVICE_VERSION: ${PLATFORM_VERSION:-1.0.0}
      PORT: 3010
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3010/healthz | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "127.0.0.1:${PHP_PORT:-3010}:3010"
    restart: unless-stopped

  apache:
    image: httpd:2.4-alpine
    depends_on:
      php-app:
        condition: service_healthy
      java-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "127.0.0.1:${APACHE_PORT:-8086}:80"
    restart: unless-stopped
    volumes:
      - ./docker/apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./docker/apache/vhosts:/usr/local/apache2/conf/vhosts:ro
      - ./docker/apache/htdocs:/usr/local/apache2/htdocs:ro

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      node-app:
        condition: service_healthy
      go-app:
        condition: service_healthy
      apache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "127.0.0.1:${NGINX_PORT:-8085}:80"
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  localstack:
    image: localstack/localstack:3.4
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      DEBUG: 0
      LAMBDA_DOCKER_NETWORK: platform-delivery-lab_default
      LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT: 120
      PERSISTENCE: 1
      SERVICES: lambda,iam,logs,s3
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:4566/_localstack/health')); assert data['services']['lambda'] in {'available', 'running'}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    ports:
      - "127.0.0.1:${LOCALSTACK_EDGE_PORT:-4566}:4566"
    restart: unless-stopped
    volumes:
      - ./infra/localstack:/etc/localstack/init/ready.d
      - ./tmp/localstack:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
