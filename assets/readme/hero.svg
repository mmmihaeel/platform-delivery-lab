<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none"
  xmlns="http://www.w3.org/2000/svg">
  <!-- Background with subtle depth -->
  <rect width="1280" height="360" rx="16" fill="#020617"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="15.5" stroke="#1E293B" stroke-opacity="0.5"/>

  <!-- Subtle Gradient Accent (Top Left) -->
  <defs>
    <radialGradient id="paint0_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) rotate(45) scale(600)">
      <stop stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="360" rx="16" fill="url(#paint0_radial)"/>

  <!-- Repository Label -->
  <rect x="60" y="50" width="180" height="24" rx="4" fill="#0F172A"/>
  <text x="70" y="67" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="0.05em">PLATFORM-DELIVERY-LAB</text>

  <!-- Process Indicator (Upper Right) -->
  <g transform="translate(940, 50)">
    <line x1="10" y1="12" x2="230" y2="12" stroke="#1E293B" stroke-width="2"/>

    <circle cx="10" cy="12" r="4" fill="#38BDF8"/>
    <text x="22" y="16" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500">package</text>

    <circle cx="95" cy="12" r="4" fill="#38BDF8"/>
    <text x="107" y="16" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500">validate</text>

    <circle cx="190" cy="12" r="4" fill="#38BDF8"/>
    <text x="202" y="16" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500">operate</text>
  </g>

  <!-- Main Title Section -->
  <text x="60" y="145" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.02em">Local-first platform engineering</text>
  <text x="60" y="185" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400">Multi-runtime delivery and cloud infrastructure validation.</text>

  <!-- Technology Chips Row -->
  <g transform="translate(60, 240)">
    <!-- Docker -->
    <rect x="0" y="0" width="90" height="36" rx="8" fill="#0F172A" stroke="#1E293B"/>
    <circle cx="16" cy="18" r="3" fill="#2496ED"/>
    <text x="28" y="23" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Docker</text>

    <!-- Kubernetes -->
    <rect x="102" y="0" width="124" height="36" rx="8" fill="#0F172A" stroke="#1E293B"/>
    <circle cx="118" cy="18" r="3" fill="#326CE5"/>
    <text x="130" y="23" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Kubernetes</text>

    <!-- Terraform -->
    <rect x="238" y="0" width="115" height="36" rx="8" fill="#0F172A" stroke="#1E293B"/>
    <circle cx="254" cy="18" r="3" fill="#844FBA"/>
    <text x="266" y="23" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Terraform</text>

    <!-- Ansible -->
    <rect x="365" y="0" width="100" height="36" rx="8" fill="#0F172A" stroke="#1E293B"/>
    <circle cx="381" cy="18" r="3" fill="#EE0000"/>
    <text x="393" y="23" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">Ansible</text>

    <!-- LocalStack -->
    <rect x="477" y="0" width="118" height="36" rx="8" fill="#0F172A" stroke="#1E293B"/>
    <circle cx="493" cy="18" r="3" fill="#00A9E0"/>
    <text x="505" y="23" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">LocalStack</text>

    <!-- CI/CD -->
    <rect x="607" y="0" width="85" height="36" rx="8" fill="#0F172A" stroke="#1E293B"/>
    <circle cx="623" cy="18" r="3" fill="#94A3B8"/>
    <text x="635" y="23" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">CI/CD</text>
  </g>
</svg>
