<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="420" rx="28" fill="#0B1220"/>
  <rect x="24" y="24" width="1232" height="372" rx="22" fill="#111827" stroke="#334155"/>
  <text x="56" y="74" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Runtime coverage</text>
  <text x="56" y="104" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="16">Four packaged services plus four Lambda packaging targets, with an intentionally bounded LocalStack invoke matrix.</text>

  <rect x="72" y="144" width="140" height="62" rx="14" fill="#1D4ED8"/><text x="116" y="182" fill="#EFF6FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Node</text>
  <rect x="230" y="144" width="140" height="62" rx="14" fill="#065F46"/><text x="286" y="182" fill="#ECFDF5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Go</text>
  <rect x="388" y="144" width="140" height="62" rx="14" fill="#92400E"/><text x="437" y="182" fill="#FFFBEB" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Java</text>
  <rect x="546" y="144" width="140" height="62" rx="14" fill="#7C3AED"/><text x="598" y="182" fill="#F5F3FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">PHP</text>

  <rect x="72" y="242" width="614" height="116" rx="18" fill="#0F172A" stroke="#334155"/>
  <text x="100" y="280" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Application services</text>
  <text x="100" y="312" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="15">Compose: all four runtimes build and run locally.</text>
  <text x="100" y="336" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="15">Kubernetes: all four runtimes are represented in the local overlay.</text>

  <rect x="736" y="144" width="468" height="214" rx="18" fill="#0F172A" stroke="#334155"/>
  <text x="766" y="184" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Lambda packaging</text>
  <text x="766" y="218" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="15">Node: packaged, deployed, invoked</text>
  <text x="766" y="244" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="15">Go: packaged artifact</text>
  <text x="766" y="270" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="15">Java: packaged, deployed, invoked</text>
  <text x="766" y="296" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="15">PHP: packaged, local handler validation</text>
  <text x="766" y="330" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="14">The LocalStack invoke matrix is intentionally narrower than the packaging matrix.</text>
</svg>
