<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="760" rx="28" fill="#0B1220"/>
  <rect x="24" y="24" width="1232" height="712" rx="22" fill="#111827" stroke="#334155"/>
  <text x="56" y="74" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Platform topology</text>
  <text x="56" y="104" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="16">Compose is the default runtime surface. Terraform targets LocalStack. Kubernetes remains a parallel local deployment path.</text>

  <rect x="56" y="144" width="170" height="88" rx="16" fill="#0F172A" stroke="#475569"/>
  <text x="115" y="180" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Operator</text>
  <text x="93" y="208" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="15">Make • Bash • Ansible</text>

  <rect x="304" y="128" width="250" height="120" rx="18" fill="#0F172A" stroke="#0F766E"/>
  <text x="392" y="166" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Nginx</text>
  <text x="352" y="194" fill="#99F6E4" font-family="Segoe UI, Arial, sans-serif" font-size="15">Primary edge on :8085</text>
  <text x="332" y="220" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="14">/api/node • /api/go • /legacy/*</text>

  <rect x="644" y="128" width="250" height="120" rx="18" fill="#0F172A" stroke="#7C2D12"/>
  <text x="724" y="166" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Apache</text>
  <text x="688" y="194" fill="#FED7AA" font-family="Segoe UI, Arial, sans-serif" font-size="15">Runtime slice on :8086</text>
  <text x="677" y="220" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="14">/php • /java • /server-status</text>

  <rect x="978" y="128" width="246" height="120" rx="18" fill="#0F172A" stroke="#1D4ED8"/>
  <text x="1033" y="166" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">LocalStack</text>
  <text x="1010" y="194" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="15">Lambda, IAM, logs on :4566</text>
  <text x="1012" y="220" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="14">Terraform-backed executable path</text>

  <rect x="216" y="336" width="180" height="106" rx="16" fill="#0F172A" stroke="#1D4ED8"/>
  <text x="282" y="374" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Node app</text>
  <text x="255" y="402" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">:3007 direct diagnostics</text>

  <rect x="430" y="336" width="180" height="106" rx="16" fill="#0F172A" stroke="#065F46"/>
  <text x="501" y="374" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Go app</text>
  <text x="472" y="402" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14">:3008 direct diagnostics</text>

  <rect x="670" y="336" width="180" height="106" rx="16" fill="#0F172A" stroke="#92400E"/>
  <text x="736" y="374" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Java app</text>
  <text x="705" y="402" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="14">:3009 behind Apache</text>

  <rect x="884" y="336" width="180" height="106" rx="16" fill="#0F172A" stroke="#7C3AED"/>
  <text x="953" y="374" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">PHP app</text>
  <text x="919" y="402" fill="#DDD6FE" font-family="Segoe UI, Arial, sans-serif" font-size="14">:3010 behind Apache</text>

  <rect x="150" y="520" width="400" height="160" rx="18" fill="#0B1325" stroke="#334155"/>
  <text x="184" y="562" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Compose topology</text>
  <text x="184" y="594" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="15">Loopback-only direct service ports for diagnostics.</text>
  <text x="184" y="620" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="15">Reviewer-facing entrypoints stay on Nginx and Apache.</text>
  <text x="184" y="652" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="14">Smoke checks assert both direct and proxied paths.</text>

  <rect x="730" y="520" width="400" height="160" rx="18" fill="#0B1325" stroke="#334155"/>
  <text x="764" y="562" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Kubernetes path</text>
  <text x="764" y="594" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="15">Base manifests and `overlays/local` mirror the service set.</text>
  <text x="764" y="620" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="15">kind exposes ingress on host ports 8090 and 8443.</text>
  <text x="764" y="652" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="14">Separate local deployment path, not part of default CI integration.</text>

  <path d="M226 188H304" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M554 188H644" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M894 188H978" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M429 248L333 336" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
  <path d="M429 248L520 336" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
  <path d="M769 248L760 336" stroke="#7C2D12" stroke-width="3" stroke-linecap="round"/>
  <path d="M769 248L974 336" stroke="#7C2D12" stroke-width="3" stroke-linecap="round"/>
  <path d="M1101 248L1101 336" stroke="#1D4ED8" stroke-width="3" stroke-linecap="round"/>
  <path d="M550 600H730" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10"/>
</svg>
