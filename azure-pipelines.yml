trigger:
  branches:
    include:
      - main
      - master

pr:
  branches:
    include:
      - main
      - master

pool:
  vmImage: ubuntu-latest

variables:
  TF_VERSION: 1.14.1

stages:
  - stage: Validate
    displayName: Static validation
    jobs:
      - job: RepositoryChecks
        displayName: Repository checks
        steps:
          - checkout: self
          - bash: cp -n .env.example .env || true
            displayName: Prepare environment
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(TF_VERSION)
          - bash: make validate
            displayName: Run validation suite

  - stage: Integration
    displayName: Compose and LocalStack
    dependsOn: Validate
    jobs:
      - job: LocalPlatformFlow
        displayName: Local platform flow
        steps:
          - checkout: self
          - bash: cp -n .env.example .env || true
            displayName: Prepare environment
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(TF_VERSION)
          - bash: |
              make up
              make smoke
              make tf-apply-localstack
              make lambda-smoke
            displayName: Run integration flow
          - bash: make down
            condition: always()
            displayName: Tear down stack
